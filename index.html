<!doctype html>
<html lang="ja" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/shim.js"></script></head><body>
<title>大東受注ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 左に緑のサイドメニュー(部門別)、上に通知とユーザーのバー、本文はカード中心。現場管理アプリの構成に合わせる */
:root{
  --bg:#f7f5f4; --surface:#ffffff; --ink:#231815; --muted:#6d625e; --line:#e7e1de;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe7ea;
  --side:#231815; --side-ink:#efe8e5; --side-mute:#a89b96; --side-active:#c8102e;
  --warn:#b45309; --warn-soft:#fdf0d9; --bad:#b42318; --bad-soft:#fde8e6; --ok:#2f7d3b; --ok-soft:#e1f2e3;
  --f-head:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; --f-body:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161211; --surface:#211b1a; --ink:#f0e9e6; --muted:#b3a6a1; --line:#392f2c;
  --accent:#ff6b7d; --accent-ink:#2a0508; --accent-soft:#3e1b20;
  --side:#100c0b; --side-ink:#e6dcd8; --side-mute:#9a8d88; --side-active:#b3122a;
  --warn:#f0b35a; --warn-soft:#3b2d12; --bad:#ff8f84; --bad-soft:#40201c; --ok:#7fd48b; --ok-soft:#1b3a20; color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#161211; --surface:#211b1a; --ink:#f0e9e6; --muted:#b3a6a1; --line:#392f2c;
  --accent:#ff6b7d; --accent-ink:#2a0508; --accent-soft:#3e1b20;
  --side:#100c0b; --side-ink:#e6dcd8; --side-mute:#9a8d88; --side-active:#b3122a;
  --warn:#f0b35a; --warn-soft:#3b2d12; --bad:#ff8f84; --bad-soft:#40201c; --ok:#7fd48b; --ok-soft:#1b3a20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:14px 12px 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;font-family:var(--f-head);font-weight:700;font-size:17px;color:#fff;letter-spacing:.02em}
.tb-logo{display:none}

.nv-g{font-size:11px;letter-spacing:.1em;color:var(--side-mute);padding:16px 12px 4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nv:hover{background:rgba(255,255,255,.09)}
.nv[aria-current=page]{background:var(--side-active);color:#fff;font-weight:700}
.nv svg{flex:none}
.nv .n{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;text-align:center;line-height:18px}
.fold{margin-top:auto;align-self:flex-start;border:1px solid rgba(255,255,255,.3);background:none;color:var(--side-ink);border-radius:20px;padding:6px 16px;cursor:pointer;font-size:13px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.tb-in{display:flex;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));min-height:56px}
.tb-sp{flex:1}
.icon-btn{border:0;background:none;cursor:pointer;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--accent-soft)}
.menu{display:none}
.bd{position:absolute;top:0;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 4px}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;color:inherit;font:inherit;font-size:13px}
.who:hover{background:rgba(0,0,0,.04)}
.who .av{width:28px;height:28px;font-size:13px}
.who .cv{font-size:10px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.tb-brand{font-family:var(--f-head);font-weight:700;display:none}
.scrim{display:none}
.pghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pghead h2.pt{font-family:var(--f-head);font-size:24px;margin:0;letter-spacing:.02em}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.out{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:22px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.grid{display:grid;gap:12px}
.alerts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.alert b{font-family:var(--f-head);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.alert span{font-size:12px;color:var(--muted)}
.alert.hot{border-color:var(--bad);background:var(--bad-soft)} .alert.hot b{color:var(--bad)}
.alert.warm{border-color:var(--warn)} .alert.warm b{color:var(--warn)}
.pipe{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pipe button{flex:1 0 108px;border:0;border-right:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left}
.pipe button:last-child{border-right:0}
.pipe button[aria-pressed=true]{background:var(--accent-soft)}
.pipe b{display:block;font-size:20px;font-family:var(--f-head);font-variant-numeric:tabular-nums}
.pipe span{font-size:11.5px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input[type=search]{flex:1 1 200px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer} tbody tr.row:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site{font-weight:700} .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--line);color:var(--ink)}
.pill.s0{background:var(--warn-soft);color:var(--warn)} .pill.s1{background:var(--warn-soft);color:var(--warn)}
.pill.s2,.pill.s3{background:var(--accent-soft);color:var(--accent)}
.pill.s4,.pill.s5{background:var(--ok-soft);color:var(--ok)} .pill.s6{background:var(--line);color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px}
.tag.ex{border-color:var(--warn);color:var(--warn)}
.late{color:var(--bad);font-weight:700}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:4px;min-width:0}
.cal .dow{min-height:0;text-align:center;font-size:12px;color:var(--muted);background:var(--bg);padding:4px}
.cal .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .out{background:var(--bg);opacity:.6}
.cal .today .d{color:var(--accent-ink);background:var(--accent);border-radius:9px;display:inline-block;padding:0 6px;font-weight:700}
.cal .over{outline:2px solid var(--bad);outline-offset:-2px}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:3px;padding:2px 5px;margin-top:3px;cursor:grab;font-size:11.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.sub{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.chip.done{opacity:.55}
.cal .drop{background:var(--accent-soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)} .cal>div{min-height:70px} .chip{font-size:10.5px}}
.sidep h3,.panel h3{font-family:var(--f-head);font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.sidep .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.load{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px}
/* report */
.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.checks{display:grid;gap:4px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer;padding:3px 0}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}

.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;height:auto;white-space:normal}

.dlg.lg{width:min(980px,100%)}
.drop2{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);cursor:pointer;text-align:center}

.drop2 input{display:none}
#im-cards{display:grid;gap:12px}
.imc{display:flex;gap:12px;padding:12px;align-items:flex-start}
.imc .imth{width:150px;max-height:210px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;flex:none}
.imc.zoomed .imth{width:min(520px,60%);max-height:none;object-fit:contain;cursor:zoom-out}
.imb{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

.imh .btn{margin-left:auto}
.imchk{display:flex;gap:6px;align-items:center;font-weight:700}
@media(max-width:640px){.imc{flex-direction:column}.imc .imth,.imc.zoomed .imth{width:100%;max-height:240px}}
.nw{white-space:nowrap}
.selc{width:34px;text-align:center;padding-left:8px;padding-right:0}
.selc input{width:18px;height:18px;cursor:pointer}
tr.picked{background:var(--accent-soft)}
.bulk{align-items:center}.bulk .sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs .tab{border:0;background:none;padding:10px 14px;font:inherit;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.btn.sm{white-space:nowrap}
.seteyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.setrel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.chip2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip2:hover{background:var(--accent-soft);border-color:var(--accent)}
.settabs{display:block;margin-bottom:4px}

.orgpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.psearch{background:var(--bg)}
.psearch input{max-width:320px}
.set-row.pr.base{background:var(--accent-soft)}

.setwrap{max-width:1000px}
.settabs .tabs{margin-bottom:0}

.settabs .st{background:var(--bg);border-bottom:1px solid var(--line);padding:2px 4px}

.setwrap{display:block;max-width:1000px}

function setBase(j){

}

function openForm(cfg){
  var el=$("#modal"),d=cfg.data;
  function fieldHtml(f){
    var v=d[f.k],id="ff-"+f.k;
    if(f.type==="staff")return '<div class="lab"><span>'+f.label+'</span><div class="staffs">'+S.settings.staff.map(function(s){return '<label><input type="checkbox" data-fst="'+esc(s)+'"'+((v||[]).indexOf(s)>=0?" checked":"")+"> "+esc(s)+"</label>"}).join("")+"</div></div>";

    var inner;
    if(f.type==="select")inner='<select id="'+id+'">'+(function(o2){var vals=o2.map(function(o){return String(Array.isArray(o)?o[0]:o)});return (v!=null&&v!==""&&vals.indexOf(String(v))<0)?o2.concat([String(v)]):o2})(f.opts).map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;return '<option value="'+esc(ov)+'"'+(String(v)===String(ov)?" selected":"")+">"+esc(ol)+"</option>"}).join("")+"</select>";
    else if(f.type==="memo")inner='<textarea id="'+id+'" rows="2">'+esc(v)+"</textarea>";

    return '<label class="'+(f.wide?"wide":"")+'">'+f.label+inner+"</label>";

  function collect(){
    cfg.fields.forEach(function(f){
      if(f.type==="staff"){d[f.k]=[].slice.call(el.querySelectorAll("[data-fst]")).filter(function(c){return c.checked}).map(function(c){return c.dataset.fst});return}

     dkBox(d)+'<div class="acts"><span>'+(cfg.onDel?'<button type="button" class="btn danger" id="f-del">削除</button>':"")+'</span><span><button type="button" class="btn" id="f-cancel">キャンセル</button> <button type="submit" class="btn pri">保存</button></span></div></form></div>';
    $("#mask",el).addEventListener("mousedown",function(e){if(e.target.id==="mask")el.innerHTML=""});
    $("#f-cancel",el).onclick=function(){el.innerHTML=""};
    var del=$("#f-del",el);
    if(del)del.onclick=function(){
      del.outerHTML='<span class="late">本当に削除しますか？ <button type="button" class="btn sm danger" id="f-del2">削除する</button></span>';
      $("#f-del2",el).onclick=function(){cfg.onDel();el.innerHTML="";toast("削除しました")};
    };
    var f=$("#jf",el);
    f.addEventListener("input",function(){collect();prev()});
    f.addEventListener("change",function(e){collect();var k=(e.target.id||"").replace("ff-","");if(cfg.redraw&&cfg.redraw(d,k)){draw()}else prev()});
    f.onsubmit=function(e){e.preventDefault();collect();var m=cfg.validate?cfg.validate(d):"";if(m){toast(m);return}cfg.onSave(d);el.innerHTML=""};
  }
  draw();
}

  if(S.mFilter!=="all"&&j.status!==+S.mFilter)return false;
  if(S.mAlert==="sei"&&j.status!==1)return false;
  if(S.mAlert==="late"&&!(j.status<3&&j.month<cur))return false;
  if(S.mAlert==="rep"&&j.status!==3)return false;
  if(S.mAlert==="bill"&&j.status!==4)return false;
  if(S.q&&(j.bldgName+(j.bldgCd||"")+(j.address||"")+j.item+(j.docNo||"")).indexOf(S.q)<0)return false;
  return true;
}

function mwList(){
  var W=S.wk,A=S.maint;
  var L=A.filter(function(j){
    var cur=ym(new Date());
    if(S.mAlert){if(S.mAlert==="sei"&&j.status!==1)return false;if(S.mAlert==="late"&&!(j.status<3&&j.month<cur))return false;if(S.mAlert==="rep"&&j.status!==3)return false;if(S.mAlert==="bill"&&j.status!==4)return false}
    else if(!W.all&&j.month!==S.mMonth)return false;
    if(W.st!=="all"&&j.status!==+W.st)return false;if(W.item&&j.item!==W.item)return false;if(W.kind&&j.kind!==W.kind)return false;if(W.all&&W.month&&j.month!==W.month)return false;
    if(S.q&&(j.bldgName+(j.bldgCd||"")+(j.address||"")+j.item+(j.docNo||"")+(j.mgr||"")).indexOf(S.q)<0)return false;return true});
  return L.sort(function(a,b){return W.sort==="bldg"?(a.bldgName+a.month).localeCompare(b.bldgName+b.month,"ja"):W.sort==="status"?(a.status-b.status)||b.month.localeCompare(a.month):(b.month.localeCompare(a.month)||(a.bldgName+a.item).localeCompare(b.bldgName+b.item,"ja"))});
}
function vMwork(){

  h+='<div class="pipe"><button data-wkst="all" aria-pressed="'+(W.st==="all")+'"><b>'+inScope.length+"</b><span>すべて</span></button>"+MT_STAT.map(function(s,i){return '<button data-wkst="'+i+'" aria-pressed="'+(W.st===""+i)+'"><b>'+cnt[i]+"</b><span>"+s.n+"</span></button>"}).join("")+"</div>";
  h+='<div class="tools"><input type="search" id="q" placeholder="建物名・コード・住所・項目・注文Noで検索" value="'+esc(S.q)+'">'+(W.all?sel("wk-month",W.month,"作業月:すべて",months):"")+sel("wk-item",W.item,"項目:すべて",items)+sel("wk-kind",W.kind,"区分:すべて",kinds)+
   '<select id="wk-sort" aria-label="並び順"><option value="month"'+(W.sort==="month"?" selected":"")+'>新しい作業月順</option><option value="bldg"'+(W.sort==="bldg"?" selected":"")+'>建物名順</option><option value="status"'+(W.sort==="status"?" selected":"")+'>状況順</option></select>'+
   ((W.st!=="all"||W.item||W.kind||W.month||S.q||S.mAlert)?'<button class="btn sm" id="wk-clr">絞り込み解除</button>':"")+'<button class="btn sm" id="wk-csv"'+(L.length?"":" disabled")+'>表示中をCSVで保存</button></div>';
  h+='<div class="panel scroll">'+(L.length?"<table><thead><tr><th>作業月</th><th>建物</th><th>維持管理項目</th><th>区分</th><th class=num>数量</th><th class=num>金額(税込)</th><th>完了</th><th>状況</th><th></th></tr></thead><tbody>"+L.map(function(j){var c=mtCalc(j),st=MT_STAT[j.status];
    return '<tr class="row" data-mopen="'+j.id+'"><td>'+j.month.replace("-","/")+'</td><td><div class="site">'+esc(j.bldgName)+(j.sample?'<span class="tag ex">例</span>':"")+'</div><div class="sub">'+esc(j.bldgCd||"")+" "+esc(j.address||"")+"</div></td><td>"+esc(j.item)+"</td><td>"+esc(j.kind)+'</td><td class="num">'+(+j.qty||0)+'</td><td class="num">'+yen(c.total)+"</td><td>"+(j.doneDate?md(j.doneDate):"—")+'</td><td><span class="pill s'+j.status+'">'+st.n+"</span></td><td>"+(st.next?'<button class="btn sm" data-mnext="'+j.id+'">'+st.next+"</button>":"")+"</td></tr>"}).join("")+"</tbody></table>":'<div class="empty">'+(A.length?"この条件の作業はありません。":"作業がありません。右上の「＋ 維持管理を追加」から登録してください。")+"</div>")+"</div>";
  return h;

function okDate(s){var m=String(s||"").trim().match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);return m?m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]):""}

function mapItem(it,layout){
  var n=String(it.name||""),u=String(it.unit||"");
  if(/エアコン/.test(n))return findPrice("エアコンクリーニング");
  if(/ルーム|ルークリ|室内ク/.test(n))return basePriceFor(layout);
  if(/LED|ＬＥＤ/i.test(n))return findPrice("LED交換");
  if(/網戸/.test(n))return findPrice(/掃出/.test(n)?"網戸交換(掃出窓)":"網戸交換(腰窓)");
  if(/クロス|かべ|壁紙/.test(n))return findPrice("量産クロス張替");
  if(/CF|ＣＦ|クッションフロア/i.test(n))return findPrice("CF張替");
  if(/巾木|幅木/.test(n))return findPrice("ソフト巾木");
  if(/フローリング|床/.test(n))return findPrice(/枚/.test(u)?"フローリング張替(枚)":"フローリング張替(㎡)");
  if(/ダイノック/.test(n))return findPrice(/ガス/.test(n)?"ダイノックシート(ガス台下)":"ダイノックシート(シンク下)");
  if(/コーキング/.test(n))return findPrice("入隅コーキング");

  if(/下地/.test(n))return findPrice("壁下地補修");

function canvasBlob(cv){return new Promise(function(res){cv.toBlob(res,"image/jpeg",0.9)})}
var PDFJS_P=null;
function loadScript(u){return new Promise(function(res,rej){var e=document.createElement("script");e.src=u;e.onload=res;e.onerror=function(){rej(new Error("load"))};document.head.appendChild(e);setTimeout(function(){rej(new Error("timeout"))},20000)})}
function loadPdfjs(){
  if(typeof pdfjsLib!=="undefined")return Promise.resolve();
  if(!PDFJS_P){var B="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";PDFJS_P=loadScript(B+"pdf.min.js").then(function(){return loadScript(B+"pdf.worker.min.js")}).catch(function(){PDFJS_P=null})}
  return PDFJS_P;
}
async function eachPage(file,fn,maxPg,maxPx){maxPx=maxPx||2000;
  var isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
  if(isPdf){
    await loadPdfjs();
    if(typeof pdfjsLib==="undefined")throw new Error("PDFを表示するライブラリを読み込めませんでした");
    var doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,n=Math.min(doc.numPages,maxPg||30);
    for(var i=1;i<=n;i++){
      if(IM.ctl.signal.aborted)return;
      var pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),sc=Math.min(4,maxPx/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:sc});
      var cv=document.createElement("canvas");cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      await fn(await canvasBlob(cv),file.name+(doc.numPages>1?"  "+i+"/"+doc.numPages+"ページ":""));
    }
  }else{
    var bm=await createImageBitmap(file),k=Math.min(1,maxPx/Math.max(bm.width,bm.height)),c2=document.createElement("canvas");
    c2.width=Math.round(bm.width*k);c2.height=Math.round(bm.height*k);var x2=c2.getContext("2d");x2.fillStyle="#fff";x2.fillRect(0,0,c2.width,c2.height);x2.drawImage(bm,0,0,c2.width,c2.height);
    await fn(await canvasBlob(c2),file.name);
  }
}
async function imRun(files){
  var sample=await claude_use("sample"),lim=null;
  if(sample){try{lim=await sample.limits()}catch(e){}}
  if(!sample||!lim||!lim.images){imProg("この表示では自動読み取りを使えません。「＋ 案件を登録」から手入力してください。");return}
  if(IM.busy)return;
  IM.busy=true;IM.ctl=new AbortController();imProg();imUpdateReg();
  var stopAll=false;
  try{
    for(var fi=0;fi<files.length&&!stopAll;fi++){
      files[fi]._dk={type:"koji",typeName:"工事予定書"};
      try{
        await eachPage(files[fi],async function(blob,label){
          if(stopAll||IM.ctl.signal.aborted)return;
          var c={status:"run",label:label,thumb:URL.createObjectURL(blob),include:false,items:[],conf:[]};IM.urls.push(c.thumb);
          var idx=IM.cards.push(c)-1;$("#im-cards").insertAdjacentHTML("beforeend",imCardHtml(c,idx));imProg();
          try{
            var r=await sample.json(IM_PROMPT,{images:[blob],signal:IM.ctl.signal,modelTier:"default"});
            if(!r||typeof r!=="object"||Array.isArray(r))throw {code:"bad_answer"};
            IM.cards[idx]=imCard(r,label,c.thumb);IM.cards[idx].file=files[fi];
          }catch(e){c.status="err";c.err=imErr(e);if(e&&(e.code==="not_granted"||e.code==="cancelled"))stopAll=true}
          imRedraw(idx);imProg();
        });
      }catch(e){
        var ec={status:"err",label:files[fi].name,thumb:"data:image/gif;base64,R0lGODlhAQABAAAAACw=",include:false,items:[],conf:[],err:(e&&e.message)||"ファイルを読み込めませんでした"};
        var ix=IM.cards.push(ec)-1;$("#im-cards").insertAdjacentHTML("beforeend",imCardHtml(ec,ix));
      }
    }
  }finally{IM.busy=false;IM.ctl=null;imProg(IM.cards.some(function(c){return c.status==="ok"})?"読み取りが終わりました。内容を確認して登録してください。":"");imUpdateReg()}
}
document.addEventListener("change",function(e){
  if(!IM.open)return;var t=e.target,k=t.dataset&&t.dataset.im;if(!k)return;
  var a=k.split(":"),i=+a[1],c=IM.cards[i];if(!c)return;
  if(a[0]==="inc"){c.include=t.checked;imUpdateReg();return}
  if(a[0]==="f"){c[a[2]]=t.value;
    if(a[2]==="layout"){c.items.forEach(function(it){if(it.auto){var p=mapItem(it,c.layout);it.pid=p?p.id:""}});imRedraw(i)}
    else if(a[2]==="dueDate"||a[2]==="site"||a[2]==="room")imRedraw(i);
    return}
  var it=c.items[+a[2]];if(!it)return;
  if(a[0]==="n"){it.name=t.value;var p=mapItem(it,c.layout);it.pid=p?p.id:"";it.auto=true;imRedraw(i)}
  else if(a[0]==="q"){it.qty=Math.max(0,+t.value||0);imRedraw(i)}
  else if(a[0]==="u"){it.unit=t.value}
  else if(a[0]==="p"){it.pid=t.value;it.auto=false;imRedraw(i)}
});
document.addEventListener("click",function(e){
  if(!IM.open)return;var t=e.target.closest("button,img");if(!t)return;var d=t.dataset||{};
  if(t.id==="im-close"){
    if(IM.cards.some(function(c){return c.status==="ok"&&c.include})&&!t.dataset.sure){t.dataset.sure="1";t.textContent="破棄して閉じる";return}
    imClose();return}
  if(t.id==="im-reg"){imRegister();return}

  if(d.imZoom!==undefined){var el=$("#imc-"+d.imZoom);if(el)el.classList.toggle("zoomed");return}
  if(d.imDrop!==undefined){var i=+d.imDrop;IM.cards[i].status="err";IM.cards[i].err="破棄しました";IM.cards[i].include=false;imRedraw(i);return}
  if(d.imRm){var q=d.imRm.split(":");IM.cards[+q[0]].items.splice(+q[1],1);imRedraw(+q[0]);return}
  if(d.imAdd!==undefined){IM.cards[+d.imAdd].items.push({name:"",qty:1,unit:"",pid:"",auto:true});imRedraw(+d.imAdd);return}
});

function parseCsv(t){
  var rows=[],r=[],f="",q=false,i=0;t=t.replace(/^﻿/,"");
  for(;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){r.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=ch}
  if(f!==""||r.length){r.push(f);rows.push(r)}
  return rows.filter(function(x){return x.some(function(v){return String(v).trim()!==""})});
}

}

  var m0=str.search(/\r?\n\r?\n/);if(m0<0)return;
  var head=str.slice(0,m0).replace(/\r?\n[ \t]+/g," "),body=str.slice(m0).replace(/^\r?\n\r?\n/,"");
  var ct=((head.match(/^content-type:\s*([^;\r\n]+)/im)||[])[1]||"text/plain").trim().toLowerCase();
  if(ct.indexOf("multipart/")===0){
    var bm=head.match(/boundary="?([^";\r\n]+)"?/i);if(!bm)return;
    body.split("--"+bm[1]).slice(1).forEach(function(sg){if(sg.indexOf("--")===0)return;mimeParts(sg.replace(/^\r?\n/,""),out)});return}
  var enc=((head.match(/^content-transfer-encoding:\s*(\S+)/im)||[])[1]||"").toLowerCase();
  var nm=(head.match(/(?:file)?name\*?="?([^";\r\n]+)"?/i)||[])[1]||"";
  out.push({ct:ct,enc:enc,name:nm,body:body});
}
function fxFiles(rawB64u,label){
  var out=[];mimeParts(b64bin(rawB64u),out);var fs=[];
  out.forEach(function(p,k){
    if(p.enc!=="base64")return;
    var isPdf=p.ct==="application/pdf"||/\.pdf$/i.test(p.name),isImg=/^image\/(png|jpe?g)$/.test(p.ct);
    if(!isPdf&&!isImg)return;
    var bin=b64bin(p.body);if(isImg&&bin.length<30000)return;
    var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var nm=(p.name||"").replace(/[\r\n]/g,"").slice(0,80);
    try{nm=decodeURIComponent(nm)}catch(e){}
    fs.push(new File([u],nm||((label||"FAX")+"_"+(k+1)+(isPdf?".pdf":".jpg")),{type:isPdf?"application/pdf":p.ct}));
  });
  return fs;
}
function fxErrMsg(e){
  var c=e&&e.code;FX.connect=(e&&e.connectUrl)||FX.connect||"";
  if(e&&e.connectUrl&&(c==="server_not_connected"||c==="needs_reauth"))return "Gmailが未接続です。下のリンクからGoogleで許可してください。";
  if(c==="needs_reauth")return "Gmailの接続が切れています。claude.aiの設定→コネクタでGmailを再接続してください。";
  if(c==="server_not_connected"||c==="server_not_found")return "Gmailが接続されていません。claude.aiの設定→コネクタでGmailを追加してください。";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return "Gmailへのアクセスが許可されていません。許可して再度お試しください。";
  if(c==="not_granted"||c==="cancelled")return "中止しました。";
  return "FAXの取得に失敗しました"+(e&&e.message?"("+String(e.message).slice(0,80)+")":"")+"。";
}

}

async function fxRun(){
  if(FX.busy)return;
  var mcp=await claude_use("mcp"),sample=await claude_use("sample"),lim=null;
  if(sample){try{lim=await sample.limits()}catch(e){}}
  if(!mcp){fxProg("この表示ではGmailに接続できません。");return}
  if(!sample||!lim||!lim.images){fxProg("この表示では自動読み取りを使えません。");return}
  FX.busy=true;FX.skipped=0;FX.ctl=new AbortController();IM.ctl=FX.ctl;FX.rows=[];$("#fx-list").innerHTML="";
  try{
    fxProg("Gmailを検索中…",true);
    var r=await mcp.callTool("Gmail","search_threads",{query:"label:efax -label:efax-処理済み has:attachment newer_than:45d",pageSize:30,view:"THREAD_VIEW_MINIMAL"},{signal:FX.ctl.signal});
    var pl=r&&r.payload;if(typeof pl==="string"){try{pl=JSON.parse(pl)}catch(e){pl=null}}
    var th=(pl&&pl.threads)||[],done=fxSet(),list=[];
    th.forEach(function(t){(t.messages||[]).forEach(function(m){
      var sj=m.subject||"";
      if(!m.id||done.indexOf(m.id)>=0||/^\s*\[Box/.test(sj)||list.some(function(x){return x.id===m.id}))return;
      if(m.sizeEstimate&&m.sizeEstimate<20000)return;
      list.push({id:m.id,date:m.date,subject:sj,sender:m.sender||"",efax:/efax/i.test(m.sender||"")})})});
    list.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
    list=list.slice(0,25);
    if(!list.length){fxProg("未処理のFAX・メールはありません。");FX.busy=false;return}
    for(var k=0;k<list.length;k++){
      if(FX.ctl.signal.aborted)break;
      var x=list[k];fxProg((k+1)+" / "+list.length+" 通を処理中…",true);
      var d=x.date?new Date(x.date):null,ds=d&&!isNaN(d)?d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
      var cm=(x.subject.match(/Caller-ID:\s*(\d+)/)||[])[1]||"";
      var head=x.efax?(cm?"FAX 発信 "+cm:"FAX"):"メール "+(x.sender||"")+" "+x.subject.trim().slice(0,40);
      var files=[];
      try{
        var g=await mcp.callTool("Gmail","get_message",{messageId:x.id,messageFormat:"RAW"},{signal:FX.ctl.signal});
        var gp=g&&g.payload;if(typeof gp==="string"){try{gp=JSON.parse(gp)}catch(e){gp=null}}
        files=gp&&gp.raw?fxFiles(gp.raw,"FAX_"+x.id):[];
      }catch(e){
        if(e&&(e.code==="cancelled"||e.name==="AbortError"))break;
        var i0=FX.rows.push({id:x.id,date:ds,caller:head,status:"err",err:fxErrMsg(e)})-1;$("#fx-list").insertAdjacentHTML("beforeend",fxRowHtml(FX.rows[i0],i0));
        if(e&&(e.code==="not_granted"||e.code==="needs_reauth"||e.code==="server_not_connected"||e.code==="not_in_manifest"||e.code==="approval_required"||e.code==="consent_required")){fxProg(fxErrMsg(e));FX.busy=false;return}
        continue}
      if(!files.length){fxMark(x.id);continue}
      for(var fi=0;fi<files.length&&fi<4;fi++){
        var file=files[fi];
        var row={id:x.id,fid:x.id+"-"+fi,isoDate:x.date||"",date:ds,caller:head+(files.length>1?" ("+file.name.slice(0,30)+")":""),status:"run",file:file};
        var i=FX.rows.push(row)-1;$("#fx-list").insertAdjacentHTML("beforeend",fxRowHtml(row,i));
        try{
          var blob0=null;
          await eachPage(file,async function(b){if(!blob0)blob0=b},1,1400);
          if(blob0)row.thumb=URL.createObjectURL(blob0);
          var a=await sample.json(fxPrompt()+"\n(参考: メール件名「"+x.subject.trim().slice(0,80)+"」 差出人 "+x.sender+")",{images:[blob0],signal:FX.ctl.signal,modelTier:"quick"});
          row.type=fxAll()[a&&a.docType]?a.docType:"other";row.summary=String((a&&a.summary)||"").slice(0,60);row.sender=String((a&&a.sender)||"").slice(0,60);row.status="ok";
          if(row.type==="other"){row.hidden=true;FX.skipped=(FX.skipped||0)+1;fxMark(x.id);var el0=$("#fx-r"+i);if(el0)el0.remove();continue}
          fxStore(row,file,blob0);
        }catch(e){
          if(e&&(e.code==="cancelled"||e.name==="AbortError")){row.status="wait";fxDraw(i);break}
          row.status="err";row.err=fxErrMsg(e);
          if(e&&e.code==="not_granted"){fxDraw(i);fxProg(row.err);FX.busy=false;return}
        }
        fxDraw(i);
      }
    }
    var n=FX.rows.filter(function(x){return x.status==="ok"&&x.type!=="other"&&x.type!=="daito"}).length;
    fxProg(FX.ctl.signal.aborted?"中止しました。":((n||FX.rows.some(function(x){return !x.hidden})?"取込できる書類 "+n+" 件":"大東建託の書類はありません")+(FX.skipped?"(大東建託以外 "+FX.skipped+" 件は除外)":"")));
  }catch(e){fxProg(fxErrMsg(e))}
  FX.busy=false;
}
function fxGo(i){
  var r=FX.rows[i];if(!r||!r.file)return;var f=r.file,t=r.type;fxMark(r.id);
  $("#modal").innerHTML="";
  if(t==="koji"){openImport();imRun([f])}
  else if(t==="request"||t==="notice"){openEmImport();emoRun(f)}
  else if(t==="order"){openMtImport();mtiRun([f])}
  else if(t==="annual"){openMpImport();mpiRun([f])}

  else if(/^c_/.test(t)){openFxc(f,t,undefined,r.fid)}
}

function sbParse(text,cfg){

function sbApply(){

function vsNz(s){return String(s==null?"":s).normalize("NFKC").replace(/[\s・\-ー]/g,"").toLowerCase()}
function vsRoom(s){return String(s==null?"":s).normalize("NFKC").replace(/\s|号室|号/g,"").replace(/^0+(?=\d)/,"").toLowerCase()}
function vsCands(r){
  var rm=vsRoom(r.room),bc=vsNz(r.bldgCd),st=vsNz(r.site);
  if(!rm&&!bc&&!st)return [];
  return S.jobs.filter(function(j){
    if(rm&&vsRoom(j.room)!==rm)return false;
    if(bc&&vsNz(j.bldgCd)===bc)return true;
    var js=vsNz(j.site);return !!(st&&js&&(js===st||(st.length>=3&&js.indexOf(st)>=0)||(js.length>=3&&st.indexOf(js)>=0)))
  }).sort(function(a,b){return (a.checks&&a.checks.value?1:0)-(b.checks&&b.checks.value?1:0)||String(b.workDate||b.dueDate||b.receivedDate||"").localeCompare(String(a.workDate||a.dueDate||a.receivedDate||""))});

function vsJobLabel(j){return j.site+" "+j.room+(j.dueDate?"(完了予定 "+md(j.dueDate)+")":"")}

async function vsLinkTo(r,j){
  var ref=null;
  if(window.dsFiles&&r.file){ref=await docKeep(r.file,{meta:{type:"value",typeName:"価値観共有シート",summary:(r.site||"")+" "+(r.room||"")}})}

async function vsRun(files){
  var sample=await claude_use("sample"),lim=null;
  if(sample){try{lim=await sample.limits()}catch(e){}}
  if(!sample||!lim||!lim.images){vsProg("この表示では自動読み取りを使えません。");return}
  if(VS.busy)return;VS.busy=true;VS.ctl=new AbortController();IM.ctl=VS.ctl;var stop=false;vsProg("読み取り中…",true);
  try{
    for(var fi=0;fi<files.length&&!stop;fi++){
      var file=files[fi],pages=[];
      files[fi]._dk={type:"value",typeName:"価値観共有シート"};
      try{await eachPage(file,async function(blob,label){pages.push({blob:blob,label:label})},12,1800)}
      catch(e){var ec={status:"err",label:file.name,err:(e&&e.message)||"ファイルを読み込めませんでした"};VS.rows.push(ec);$("#vs-list").insertAdjacentHTML("beforeend",vsRowHtml(ec,VS.rows.length-1));continue}
      for(var pi=0;pi<pages.length&&!stop;pi++){
        if(VS.ctl.signal.aborted){stop=true;break}
        var pg=pages[pi],row={status:"run",label:pg.label,thumb:URL.createObjectURL(pg.blob)};
        var i=VS.rows.push(row)-1;$("#vs-list").insertAdjacentHTML("beforeend",vsRowHtml(row,i));vsProg((pi+1)+"/"+pages.length+"ページ "+file.name+" を処理中…",true);
        try{
          var a=await sample.json(VS_PROMPT,{images:[pg.blob],signal:VS.ctl.signal,modelTier:"default"});
          if(!a||typeof a!=="object"||Array.isArray(a))throw {code:"bad_answer"};
          if(a.isSheet===false){row.status="err";row.err="価値観共有シートではないページです"}
          else{
            var T=function(v){return String(v==null?"":v).trim()};
            row.site=T(a.site);row.room=T(a.room);row.bldgCd=T(a.bldgCd);row.date=T(a.date);row.status="ok";
            row.file=pages.length===1?file:new File([await fitBlob(pg.blob,650*1024)],file.name.replace(/\.[^.]+$/,"")+"_"+(pi+1)+"ページ.jpg",{type:"image/jpeg"});
            row.file._dk={type:"value",typeName:"価値観共有シート"};
            row.cands=vsCands(row);
            var free=row.cands.filter(function(j){return !(j.checks&&j.checks.value)});
            if(free.length===1||(row.cands.length===1))await vsLinkTo(row,free.length===1?free[0]:row.cands[0]);
          }
        }catch(e){row.status="err";row.err=imErr(e)||(e&&e.message)||"読み取れませんでした";if(e&&(e.code==="not_granted"||e.code==="cancelled"))stop=true}
        vsDraw(i);
      }
    }
  }finally{
    VS.busy=false;VS.ctl=null;var n=VS.rows.filter(function(r){return r.linked}).length,m=VS.rows.filter(function(r){return r.status==="ok"&&!r.linked}).length;
    vsProg(VS.rows.length?(n+"件を案件に紐づけました"+(m?"。あと"+m+"件は案件を選んでください":"")):"");render();
  }
}

var COLN=["jobs","emerg","maint","mdef","water"];
var NORM={
 jobs:{str:["site","room","area","kind","orderNo","layout","receivedDate","dueDate","workDate","memo","bldgCd","roomCd","address","visitDate","orderDate","daitoStaff","daitoStaffCd","parking","lockNo"],num:["override"],max:6},

 mdef:{str:["date","month","bldgCd","bldgName","place","content","memo"],num:[],max:2},
 water:{str:["kind","site","room","address","office","custNo","date","method","applyDate","jobId","memo","uAddr","uName","uKana","uTel","uPay","uPayer","uNewAddr","uWork","uOcc","uSendTo"],num:[],max:2}};
function normDoc(c,id,o){
  var n=NORM[c],r=(o&&typeof o==="object")?o:{};
  r.id=id;
  if(c==="maint"&&r.qty==null)r.qty=1;
  n.str.forEach(function(k){r[k]=r[k]==null?"":String(r[k])});
  n.num.forEach(function(k){r[k]=+r[k]||0});
  r.status=Math.min(n.max,Math.max(0,Math.floor(+r.status||0)));
  if(Array.isArray(r.staff))r.staff=r.staff.map(String);else r.staff=[];
  if(c==="jobs"){
    r.items=Array.isArray(r.items)?r.items.filter(function(i){return i&&typeof i==="object"}).map(function(i){return {pid:i.pid,name:String(i.name==null?"":i.name),unit:String(i.unit==null?"":i.unit),price:+i.price||0,qty:+i.qty||0,base:!!i.base}}):[];
    r.checks=(r.checks&&typeof r.checks==="object")?r.checks:{};
  }
  if(c==="maint"&&!(+r.qty))r.qty=r.qty===0?0:1;
  r.sample=!!r.sample;
  return r;
}
var RTM=0;
function ready(){if(loaded.settings&&COLN.every(function(c){return loaded[c]})){S.ready=true;if(RTM)return;RTM=setTimeout(function(){RTM=0;render()},40)}}
var PEND={},PTM={};
function boot(){
  var ui=lsGet("ui");
  S.tab="home";if(ui&&NAV.some(function(n){return n.tab===ui.tab}))S.tab=ui.tab;
  $("#scrim").onclick=function(){document.body.classList.remove("nav-open")};

      S.persist=false;wtfInit();acInit();
      COLN.forEach(function(c){var v=lsGet(c);S[c]=(Array.isArray(v)?v:(c==="jobs"?sampleJobs():[])).map(function(o){return normDoc(c,String((o&&o.id)||nid("x")),o)});loaded[c]=true});
      var st=lsGet("settings");if(st&&st.prices)S.settings=st;normSettings();loaded.settings=true;ready();return;
    }
    db=d;wtfInit();acInit();
    COLN.forEach(function(c){
      db.collection(c).onSnapshot(function(snap){PEND[c]=snap;if(!PTM[c])PTM[c]=setTimeout(function(){PTM[c]=0;var sn=PEND[c];PEND[c]=null;if(!sn)return;S[c]=sn.docs.map(function(x){var d=x.data();try{d=JSON.parse(JSON.stringify(d))}catch(e){}return normDoc(c,x.id,d)});S.persist=true;loaded[c]=true;ready()},80)},function(){S.persist=false;loaded[c]=true;ready()});
    });
    db.doc("settings/main").onSnapshot(function(snap){
      if(snap.exists){var v=snap.data();if(v&&v.prices&&v.staff){try{S.settings=JSON.parse(JSON.stringify(v))}catch(e){S.settings=v}}}
      normSettings();loaded.settings=true;ready();
    },function(){normSettings();loaded.settings=true;ready()});
  });
  window.addEventListener('error',function(ev){var m=document.getElementById('main');if(m&&!S.ready)m.innerHTML='<div class="empty" style="white-space:pre-wrap;text-align:left">エラー: '+String(ev.message).replace(/</g,'&lt;')+' @'+ev.lineno+'</div>'});
  setTimeout(function(){if(!S.ready){COLN.forEach(function(c){loaded[c]=true;if(!S[c])S[c]=[]});normSettings();S.persist=false;loaded.settings=true;ready()}},6000);
}
boot();
})();
