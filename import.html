<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ取込</title>
<style>body{font-family:'Noto Sans JP',sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#1c2a24}button{padding:10px 16px;border:0;border-radius:8px;background:#1b6847;color:#fff;font-size:15px;cursor:pointer}#m{margin-top:14px;white-space:pre-wrap}</style></head><body>
<h2>データ取込(移行用)</h2>
<p>アーティファクト版から書き出した JSON ファイルを選ぶと、このアプリのデータベースに取り込みます(同じIDのデータは上書きされます)。先に <a href="/">アプリ</a>でログインしてください。</p>
<input type="file" id="f" accept="application/json,.json"> <button id="go">取り込む</button><div id="m"></div>
<script>
document.getElementById('go').onclick=async function(){
  var m=document.getElementById('m'),f=document.getElementById('f').files[0];if(!f){m.textContent='ファイルを選んでください';return}
  try{var data=JSON.parse(await f.text());m.textContent='取り込み中…';
    var r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({op:'import',data:data})});
    var j=await r.json();m.textContent=r.ok?(j.imported+' 件を取り込みました。アプリを開き直してください。'):('失敗: '+JSON.stringify(j.error||j));
  }catch(e){m.textContent='失敗: '+e.message}
};
</script></body></html>
